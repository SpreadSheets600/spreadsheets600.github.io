<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="SpreadSheets600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .bar { transform-origin: bottom; animation: rise 3s ease-in-out infinite alternate; }
      @keyframes rise { from { transform: scaleY(0.45); } to { transform: scaleY(1); } }
    </style>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g transform="translate(64 62)">
    <circle cx="6" cy="6" r="5" fill="#34d399"/>
    <text x="22" y="11" font-size="13" fill="#ffffff" fill-opacity="0.55" letter-spacing="2">LIVE PROFILE</text>
  </g>
  <text x="64" y="138" font-size="52" font-weight="700" fill="url(#ac)">SpreadSheets600</text>
  <text x="66" y="170" font-size="17" fill="#ffffff" fill-opacity="0.65">A portfolio that knows what I'm playing, watching and shipping.</text>
  <g font-size="13" fill="#ffffff" fill-opacity="0.8">
    <g transform="translate(64 198)"><rect width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/><text x="33" y="18" text-anchor="middle">Astro</text></g>
    <g transform="translate(140 198)"><rect width="84" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/><text x="42" y="18" text-anchor="middle">Tailwind</text></g>
    <g transform="translate(234 198)"><rect width="96" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/><text x="48" y="18" text-anchor="middle">Cloudflare</text></g>
    <g transform="translate(340 198)"><rect width="84" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/><text x="42" y="18" text-anchor="middle">Live API</text></g>
  </g>
  <g transform="translate(650 70)" fill="url(#ac)">
    <rect class="bar" x="0" y="60" width="22" height="90" rx="5" style="animation-delay:0s"/>
    <rect class="bar" x="34" y="30" width="22" height="120" rx="5" style="animation-delay:-0.6s"/>
    <rect class="bar" x="68" y="0" width="22" height="150" rx="5" style="animation-delay:-1.2s"/>
    <rect class="bar" x="102" y="45" width="22" height="105" rx="5" style="animation-delay:-1.8s"/>
    <rect class="bar" x="136" y="75" width="22" height="75" rx="5" style="animation-delay:-2.4s"/>
  </g>
</svg>
