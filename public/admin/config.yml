backend:
  name: github
  repo: YOUR_GITHUB_ORG/YOUR_REPO
  branch: main
  # Optional: OAuth authenticator URL (recommended for multi-user).
  # base_url: https://YOUR_AUTH_DOMAIN

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - {
          label: "Hero Image",
          name: "heroImage",
          widget: "image",
          required: false,
        }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Author Role", name: "authorRole", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "bookmarks"
    label: "Bookmarks"
    folder: "src/content/bookmarks"
    create: true
    extension: "yml"
    format: "yaml"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon", name: "icon", widget: "string" }
      - { label: "Accent", name: "accent", widget: "string" }
      - { label: "Accent Soft", name: "accentSoft", widget: "string" }
      - { label: "Accent Faint", name: "accentFaint", widget: "string" }
      - { label: "Order", name: "order", widget: "number", default: 0 }
      - label: "Items"
        name: "items"
        widget: "list"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Icon", name: "icon", widget: "string" }
          - { label: "Text", name: "text", widget: "text", required: false }
          - { label: "Prompt", name: "prompt", widget: "text", required: false }
          - { label: "Note", name: "note", widget: "string", required: false }
          - label: "Links"
            name: "links"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Primary", name: "primary", widget: "boolean", default: false }
