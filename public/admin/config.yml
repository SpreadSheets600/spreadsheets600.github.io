backend:
  name: github
  repo: SpreadSheets600/spreadsheets600.github.io
  branch: jam-stack
  skip_ci: false
  # Optional: OAuth authenticator URL (recommended for multi-user).
  # base_url: https://YOUR_AUTH_DOMAIN

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "repositories"
    label: "Repositories"
    folder: "src/content/repositories"
    create: false
    extension: "yml"
    format: "yaml"
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - { label: "HTML URL", name: "html_url", widget: "string" }
      - {
          label: "Homepage",
          name: "homepage",
          widget: "string",
          required: false,
        }
      - { label: "Topics", name: "topics", widget: "list", required: false }

  - name: "project_settings"
    label: "Projects"
    files:
      - name: "featured_projects"
        label: "Featured Projects"
        file: "src/data/featured-projects.json"
        format: "json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.repo}}"
            fields:
              - {
                  label: "Repository",
                  name: "repo",
                  widget: "relation",
                  collection: "repositories",
                  search_fields: ["name"],
                  display_fields: ["name"],
                  value_field: "name",
                }
              - {
                  label: "Enabled",
                  name: "enabled",
                  widget: "boolean",
                  default: true,
                }
              - { label: "Order", name: "order", widget: "number", default: 0 }
              - {
                  label: "Image",
                  name: "image",
                  widget: "image",
                  required: false,
                }
              - {
                  label: "Title Override",
                  name: "title",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Description Override",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Homepage Override",
                  name: "homepage",
                  widget: "string",
                  required: false,
                }

  - name: "connect_settings"
    label: "Connect"
    files:
      - name: "social_links"
        label: "Social Links"
        file: "src/data/social-links.json"
        format: "json"
        fields:
          - label: "Links"
            name: "links"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - {
                  label: "Description",
                  name: "description",
                  widget: "string",
                  required: false,
                }
              - { label: "URL", name: "url", widget: "string" }
              - {
                  label: "Icon",
                  name: "icon",
                  widget: "select",
                  options:
                    [
                      "github",
                      "twitter",
                      "linkedin",
                      "email",
                      "linktree",
                      "instagram",
                      "youtube",
                      "tiktok",
                      "discord",
                      "website",
                    ],
                }
              - {
                  label: "Color Class",
                  name: "color",
                  widget: "string",
                  required: false,
                }
              - { label: "Order", name: "order", widget: "number", default: 0 }
              - {
                  label: "Enabled",
                  name: "enabled",
                  widget: "boolean",
                  default: true,
                }

  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - {
          label: "Hero Image",
          name: "heroImage",
          widget: "image",
          required: false,
        }
      - { label: "Author", name: "author", widget: "string", required: false }
      - {
          label: "Author Role",
          name: "authorRole",
          widget: "string",
          required: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "bookmarks"
    label: "Bookmarks"
    folder: "src/content/bookmarks"
    create: true
    extension: "yml"
    format: "yaml"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon", name: "icon", widget: "string" }
      - { label: "Accent", name: "accent", widget: "string" }
      - { label: "Accent Soft", name: "accentSoft", widget: "string" }
      - { label: "Accent Faint", name: "accentFaint", widget: "string" }
      - { label: "Order", name: "order", widget: "number", default: 0 }
      - label: "Items"
        name: "items"
        widget: "list"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Description",
              name: "description",
              widget: "text",
              required: false,
            }
          - { label: "Icon", name: "icon", widget: "string" }
          - { label: "Text", name: "text", widget: "text", required: false }
          - { label: "Prompt", name: "prompt", widget: "text", required: false }
          - { label: "Note", name: "note", widget: "string", required: false }
          - label: "Links"
            name: "links"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - {
                  label: "Primary",
                  name: "primary",
                  widget: "boolean",
                  default: false,
                }
