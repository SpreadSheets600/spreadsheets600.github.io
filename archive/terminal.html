<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SOHAM — Terminal</title>

		<!-- Fonts -->
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

		<!-- Phosphor Icons -->
		<script src="https://unpkg.com/@phosphor-icons/web"></script>

		<!-- Tailwind CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							base: "#0f0f0f",
						},
						fontFamily: {
							sans: ["Poppins", "ui-sans-serif", "system-ui", "sans-serif"],
							mono: ["JetBrains Mono", "ui-monospace", "monospace"],
						},
						boxShadow: {
							glow: "0 10px 40px rgba(0,0,0,0.45)",
							innerGlow: "inset 0 0 0 1px rgba(255,255,255,0.08)",
						},
						keyframes: {
							blink: {
								"0%, 50%": { opacity: "1" },
								"51%, 100%": { opacity: "0" },
							},
							float: {
								"0%, 100%": { transform: "translateY(0)" },
								"50%": { transform: "translateY(-8px)" },
							},
						},
						animation: {
							blink: "blink 1s infinite",
							float: "float 6s ease-in-out infinite",
						},
					},
				},
			};
		</script>
	</head>
	<body class="bg-black text-white font-sans min-h-screen">
		<!-- Background -->
		<div class="fixed inset-0 -z-10">
			<div class="absolute inset-0 bg-[url('3.jpg')] bg-cover bg-center"></div>
			<div class="absolute inset-0 bg-black/95 backdrop-blur-sm"></div>
			<div class="absolute inset-0 bg-[radial-gradient(60%_60%_at_50%_10%,rgba(255,255,255,0.08),rgba(0,0,0,0))]"></div>
		</div>

		<!-- Terminal Header -->
		<div class="relative border-b border-white/10 bg-black/30 backdrop-blur-xl p-4">
			<div class="mx-auto max-w-7xl flex items-center justify-between">
				<div class="flex items-center gap-4">
					<div class="flex gap-2">
						<div class="w-3 h-3 bg-red-500 rounded-full"></div>
						<div class="w-3 h-3 bg-yellow-500 rounded-full"></div>
						<div class="w-3 h-3 bg-green-500 rounded-full"></div>
					</div>
					<span class="font-mono text-green-400">soham@archlinux:~</span>
				</div>
				<div class="flex items-center gap-4">
					<span class="text-sm text-white/60">Arch Terminal</span>
					<a href="./index.html" class="text-white/70 hover:text-white transition">
						<i class="ph ph-house text-xl"></i>
					</a>
				</div>
			</div>
		</div>

		<!-- Terminal Content -->
		<div class="h-[calc(100vh-80px)] p-8">
			<div class="h-full rounded-2xl border border-white/10 bg-black/30 backdrop-blur-xl p-6 font-mono text-sm overflow-auto">
				<!-- Welcome Message -->
				<div class="mb-4">
					<div class="text-green-400">Welcome to soham's Arch Terminal</div>
					<div class="text-white/60 text-xs">Type 'help' to see available commands</div>
				</div>

				<!-- Terminal Output -->
				<div id="output" class="mb-4"></div>

				<!-- Input Line -->
				<div class="flex items-center">
					<span class="text-green-400">soham@archlinux</span>
					<span class="text-white">:</span>
					<span class="text-blue-400">~</span>
					<span class="text-white ml-1">$ </span>
					<input 
						type="text" 
						id="commandInput" 
						class="bg-transparent border-none outline-none text-green-400 flex-1 ml-2 font-mono"
						autocomplete="off"
						autofocus
					/>
					<span class="animate-blink text-green-400">█</span>
				</div>
			</div>
		</div>

		<script>
			const output = document.getElementById("output");
			const input = document.getElementById("commandInput");
			let commandHistory = [];
			let historyIndex = -1;
			let currentDir = "/home/soham";
			const startTime = Date.now();

			const fileSystem = {
				"/": {
					type: "dir",
					contents: ["home", "usr", "var", "etc", "bin", "tmp", "root"],
				},
				"/home": {
					type: "dir",
					contents: ["soham"],
				},
				"/home/soham": {
					type: "dir",
					contents: [".bashrc", ".profile", ".viminfo", ".ssh", "projects", "documents", "downloads"],
				},
				"/home/soham/projects": {
					type: "dir",
					contents: ["steam-wrapped", "novatra", "porahobebot", "discord-bots", "web-apps"],
				},
				"/home/soham/.bashrc": {
					type: "file",
					content: `# ~/.bashrc: executed by bash(1) for non-login shells.

export PATH=$HOME/bin:/usr/local/bin:$PATH
export EDITOR=vim

# Aliases
alias ll='ls -alF'
alias la='ls -A'
alias l='ls -CF'
alias ..='cd ..'
alias ...='cd ../..'

# Custom prompt
PS1='\\[\\033[01;32m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]\\$ '`,
				},
			};

			const commands = {
				help: () => `Available commands:
  File Operations:
    ls [path]     - List directory contents
    cd [path]     - Change directory
    pwd           - Print working directory
    cat [file]    - Display file contents
    touch [file]  - Create empty file
    mkdir [dir]   - Create directory
    rm [file]     - Remove file
    cp [src] [dst] - Copy file
    mv [src] [dst] - Move/rename file
    find [path]   - Find files
    grep [pattern] - Search in files
    
  System Info:
    whoami        - Current user
    uname [-a]    - System information
    neofetch      - System info with ASCII
    uptime        - System uptime
    date          - Current date/time
    ps            - Running processes
    top           - Process monitor
    df [-h]       - Disk usage
    free [-h]     - Memory usage
    lscpu         - CPU information
    
  Fun Commands:
    cowsay [text] - ASCII cow says something
    fortune       - Random fortune cookie
    matrix        - Matrix rain effect
    hack          - Hacker simulator
    spotify       - Show current Spotify track
    music         - Alias for spotify
    
  Network:
    ping [host]   - Ping host
    wget [url]    - Download file
    curl [url]    - HTTP request
    netstat       - Network connections
    
  Text Processing:
    echo [text]   - Print text
    head [file]   - First 10 lines
    tail [file]   - Last 10 lines
    wc [file]     - Word count
    sort [file]   - Sort lines
    
  System Control:
    history       - Command history
    clear         - Clear terminal
    exit          - Close terminal`,

				whoami: () => "soham",

				pwd: () => currentDir,

				ls: (args) => {
					const path = args[0] || currentDir;
					const fullPath = path.startsWith("/") ? path : `${currentDir}/${path}`;
					const dir = fileSystem[fullPath];

					if (!dir) return `ls: cannot access '${path}': No such file or directory`;
					if (dir.type !== "dir") return `ls: ${path}: Not a directory`;

					return dir.contents.join("  ");
				},

				cd: (args) => {
					if (!args[0]) {
						currentDir = "/home/soham";
						return "";
					}

					const path = args[0];
					let newPath;

					if (path === "..") {
						const parts = currentDir.split("/").filter((p) => p);
						parts.pop();
						newPath = "/" + parts.join("/");
						if (newPath === "/") newPath = "/";
					} else if (path.startsWith("/")) {
						newPath = path;
					} else {
						newPath = currentDir === "/" ? `/${path}` : `${currentDir}/${path}`;
					}

					if (fileSystem[newPath] && fileSystem[newPath].type === "dir") {
						currentDir = newPath;
						return "";
					} else {
						return `cd: ${path}: No such file or directory`;
					}
				},

				cat: (args) => {
					if (!args[0]) return "cat: missing file operand";
					const path = args[0].startsWith("/") ? args[0] : `${currentDir}/${args[0]}`;
					const file = fileSystem[path];

					if (!file) return `cat: ${args[0]}: No such file or directory`;
					if (file.type === "dir") return `cat: ${args[0]}: Is a directory`;

					return file.content || "File content not available";
				},

				echo: (args) => args.join(" "),

				date: () => new Date().toString(),

				uptime: () => {
					const uptimeMs = Date.now() - startTime;
					const days = Math.floor(uptimeMs / (1000 * 60 * 60 * 24));
					const hours = Math.floor((uptimeMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
					const minutes = Math.floor((uptimeMs % (1000 * 60 * 60)) / (1000 * 60));
					const seconds = Math.floor((uptimeMs % (1000 * 60)) / 1000);
					return `up ${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
				},

				ps: () => `  PID TTY          TIME CMD
 1234 pts/0    00:00:01 bash
 5678 pts/0    00:00:00 node
 9012 pts/0    00:00:02 python3
 3456 pts/0    00:00:00 vim
 7890 pts/0    00:00:00 ps`,

				top: () => `top - ${new Date().toTimeString().split(" ")[0]} up 15 days, 7:23, 1 user, load average: 0.15, 0.12, 0.08
Tasks: 156 total, 1 running, 155 sleeping, 0 stopped, 0 zombie
%Cpu(s): 2.3 us, 1.2 sy, 0.0 ni, 96.5 id, 0.0 wa, 0.0 hi, 0.0 si, 0.0 st
MiB Mem : 3951.2 total, 567.8 free, 1894.5 used, 1488.9 buff/cache
MiB Swap: 2048.0 total, 2048.0 free, 0.0 used. 1876.5 avail Mem

  PID USER      PR  NI    VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND
 1234 soham     20   0  123456  45678   1234 S   2.3   1.2   0:01.23 node
 5678 soham     20   0   98765  32109   5678 S   1.0   0.8   0:00.45 python3`,

				df: (args) => {
					const human = args.includes("-h");
					return human
						? `Filesystem      Size  Used Avail Use% Mounted on
/dev/vda1        25G  8.1G   16G  35% /
devtmpfs        2.0G     0  2.0G   0% /dev
tmpfs           2.0G     0  2.0G   0% /dev/shm`
						: `Filesystem      1K-blocks    Used Available Use% Mounted on
/dev/vda1        25213952 8234567  15979385  35% /
devtmpfs          2025644       0   2025644   0% /dev
tmpfs             2030644       0   2030644   0% /dev/shm`;
				},

				free: (args) => {
					const human = args.includes("-h");
					return human
						? `              total        used        free      shared  buff/cache   available
Mem:           3.9G        1.8G        567M         12M        1.5G        1.8G
Swap:          2.0G          0B        2.0G`
						: `              total        used        free      shared  buff/cache   available
Mem:        4046336     1894567      567890       12345     1583879     1876543
Swap:       2097148           0     2097148`;
				},

				uname: (args) => {
					if (args.includes("-a")) {
						return "Linux vps 5.15.0-91-generic #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023 x86_64 x86_64 x86_64 GNU/Linux";
					}
					return "Linux";
				},

				lscpu: () => `Architecture:                    x86_64
CPU op-mode(s):                  32-bit, 64-bit
Byte Order:                      Little Endian
Address sizes:                   46 bits physical, 48 bits virtual
CPU(s):                          2
On-line CPU(s) list:             0,1
Thread(s) per core:              1
Core(s) per socket:              2
Socket(s):                       1
NUMA node(s):                    1
Vendor ID:                       GenuineIntel
CPU family:                      6
Model:                           79
Model name:                      Intel(R) Xeon(R) CPU E5-2686 v4 @ 2.30GHz`,

				ping: (args) => {
					const host = args[0] || "google.com";
					return `PING ${host} (172.217.164.110) 56(84) bytes of data.
64 bytes from ${host}: icmp_seq=1 ttl=117 time=12.3 ms
64 bytes from ${host}: icmp_seq=2 ttl=117 time=11.8 ms
64 bytes from ${host}: icmp_seq=3 ttl=117 time=12.1 ms
--- ${host} ping statistics ---
3 packets transmitted, 3 received, 0% packet loss
rtt min/avg/max/mdev = 11.8/12.1/12.3/0.2 ms`;
				},

				wget: (args) => {
					const url = args[0] || "example.com";
					return `--2023-12-16 16:43:10--  ${url}
Resolving ${url}... 93.184.216.34
Connecting to ${url}|93.184.216.34|:80... connected.
HTTP request sent, awaiting response... 200 OK
Length: 1256 (1.2K) [text/html]
Saving to: 'index.html'

index.html          100%[===================>]   1.23K  --.-KB/s    in 0s

2023-12-16 16:43:10 (45.2 MB/s) - 'index.html' saved [1256/1256]`;
				},

				curl: (args) => {
					const url = args[0] || "httpbin.org/ip";
					return `{
  "origin": "203.0.113.42"
}`;
				},

				netstat: () => `Active Internet connections (w/o servers)
Proto Recv-Q Send-Q Local Address           Foreign Address         State
tcp        0      0 vps:ssh                 203.0.113.100:54321     ESTABLISHED
tcp        0      0 vps:80                  203.0.113.200:45678     TIME_WAIT`,

				touch: (args) => {
					if (!args[0]) return "touch: missing file operand";
					return `Created file: ${args[0]}`;
				},

				mkdir: (args) => {
					if (!args[0]) return "mkdir: missing operand";
					return `Created directory: ${args[0]}`;
				},

				rm: (args) => {
					if (!args[0]) return "rm: missing operand";
					return `Removed: ${args[0]}`;
				},

				cp: (args) => {
					if (args.length < 2) return "cp: missing destination file operand";
					return `Copied ${args[0]} to ${args[1]}`;
				},

				mv: (args) => {
					if (args.length < 2) return "mv: missing destination file operand";
					return `Moved ${args[0]} to ${args[1]}`;
				},

				find: (args) => {
					const path = args[0] || ".";
					return `${path}/projects
${path}/projects/steam-wrapped
${path}/projects/novatra
${path}/documents
${path}/.bashrc`;
				},

				grep: (args) => {
					if (!args[0]) return "grep: missing pattern";
					return `Found pattern '${args[0]}' in multiple files`;
				},

				head: (args) => {
					const file = args[0] || "file.txt";
					return `First 10 lines of ${file}:
Line 1
Line 2
Line 3
...`;
				},

				tail: (args) => {
					const file = args[0] || "file.txt";
					return `Last 10 lines of ${file}:
...
Line 8
Line 9
Line 10`;
				},

				wc: (args) => {
					const file = args[0] || "file.txt";
					return `  10   50  300 ${file}`;
				},

				sort: (args) => {
					const file = args[0] || "file.txt";
					return `Sorted content of ${file}`;
				},

				neofetch: () => {
					const uptimeMs = Date.now() - startTime;
					const days = Math.floor(uptimeMs / (1000 * 60 * 60 * 24));
					const hours = Math.floor((uptimeMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
					const minutes = Math.floor((uptimeMs % (1000 * 60 * 60)) / (1000 * 60));
					const seconds = Math.floor((uptimeMs % (1000 * 60)) / 1000);
					return `
                    /\\                          soham@archlinux
                   /  \\                         --------------
                  /\\   \\                        OS: Arch Linux x86_64
                 /      \\                       Kernel: 6.6.8-arch1-1
                /   ,,   \\                      Uptime: ${days}d ${hours}h ${minutes}m ${seconds}s
               /   |  |  -\\                     Shell: zsh 5.9
              /_-''    ''-_\\                    CPU: Intel i7-13620H @ 4.90GHz
                                                GPU: NVIDIA GeForce RTX 4070
                                                Memory: 12.3GiB / 32.0GiB
                                                Local IP: 192.168.1.42
                                                
                                                ${new Date().toLocaleDateString("en-US", {
													weekday: "long",
													year: "numeric",
													month: "long",
													day: "numeric",
												})}
                                                ${new Date().toLocaleTimeString("en-US", {
													hour12: false,
												})}`;
				},

				cowsay: (args) => {
					const text = args.join(" ") || "Hello from Arch!";
					return ` ${"_".repeat(text.length + 2)}
< ${text} >
 ${"‾".repeat(text.length + 2)}
        \\   ^__^
         \\  (oo)\\_______
            (__)\\       )\\/\\
                ||----w |
                ||     ||`;
				},

				fortune: () => {
					const fortunes = ["The best way to predict the future is to invent it.", "Code is like humor. When you have to explain it, it's bad.", "There are only 10 types of people: those who understand binary and those who don't.", "A computer is like air conditioning - it becomes useless when you open Windows.", "Programming is 10% science, 20% ingenuity, and 70% getting the ingenuity to work with the science."];
					return fortunes[Math.floor(Math.random() * fortunes.length)];
				},

				matrix: () => {
					let output = "";
					for (let i = 0; i < 10; i++) {
						let line = "";
						for (let j = 0; j < 50; j++) {
							line += String.fromCharCode(0x30a0 + Math.random() * 96);
						}
						output += line + "\n";
					}
					return output;
				},

				spotify: async () => {
					try {
						const response = await fetch('/.netlify/functions/spotify-auth');
						const data = await response.json();
						
						if (!data) {
							return 'No Spotify activity found';
						}

						const progressBar = data.duration_ms > 0 ? 
							`[${'█'.repeat(Math.floor((data.progress_ms / data.duration_ms) * 20))}${' '.repeat(20 - Math.floor((data.progress_ms / data.duration_ms) * 20))}]` : '';
						
						const currentTime = Math.floor(data.progress_ms / 1000);
						const totalTime = Math.floor(data.duration_ms / 1000);
						const timeDisplay = `${Math.floor(currentTime / 60)}:${(currentTime % 60).toString().padStart(2, '0')} / ${Math.floor(totalTime / 60)}:${(totalTime % 60).toString().padStart(2, '0')}`;

						return `🎵 ${data.is_playing ? 'Now Playing' : data.recently_played ? 'Recently Played' : 'Paused'}
Track: ${data.track}
Artist: ${data.artist}
Album: ${data.album}
${data.duration_ms > 0 ? `${progressBar} ${timeDisplay}` : ''}`;
					} catch (error) {
						return 'Failed to fetch Spotify data. Make sure the API is configured.';
					}
				},

				hack: () => `[████████████████████████████████] 100%
ACCESS GRANTED
Welcome to the mainframe...
Bypassing firewall...
Downloading classified files...
Just kidding! This is just a terminal simulator 😄`,

				history: () => commandHistory.map((cmd, i) => `${i + 1}  ${cmd}`).join("\n"),

				clear: () => {
					output.innerHTML = "";
					return "";
				},

				exit: () => {
					window.location.href = "./index.html";
					return "Redirecting to home...";
				},
			};

			async function executeCommand(cmd) {
				const trimmed = cmd.trim();
				if (!trimmed) return "";

				commandHistory.push(trimmed);
				historyIndex = commandHistory.length;

				const [command, ...args] = trimmed.split(" ");

				if (commands[command]) {
					const result = commands[command](args);
					return result instanceof Promise ? await result : result;
				} else {
					return `bash: ${command}: command not found`;
				}
			}

			function addOutput(command, result) {
				const div = document.createElement("div");
				div.innerHTML = `
					<div class="flex items-center mb-1">
						<span class="text-green-400">soham@archlinux</span>
						<span class="text-white">:</span>
						<span class="text-blue-400">${currentDir === "/home/soham" ? "~" : currentDir}</span>
						<span class="text-white ml-1">$ </span>
						<span class="text-green-400 ml-1">${command}</span>
					</div>
					${result ? `<div class="mb-2 whitespace-pre-wrap text-white/80">${result}</div>` : ""}
				`;
				output.appendChild(div);

				// Scroll to bottom
				const terminal = document.querySelector(".rounded-2xl");
				terminal.scrollTop = terminal.scrollHeight;
			}

			input.addEventListener("keydown", async (e) => {
				if (e.key === "Enter") {
					const command = input.value;
					const result = await executeCommand(command);
					addOutput(command, result);
					input.value = "";
				} else if (e.key === "ArrowUp") {
					e.preventDefault();
					if (historyIndex > 0) {
						historyIndex--;
						input.value = commandHistory[historyIndex];
					}
				} else if (e.key === "ArrowDown") {
					e.preventDefault();
					if (historyIndex < commandHistory.length - 1) {
						historyIndex++;
						input.value = commandHistory[historyIndex];
					} else {
						historyIndex = commandHistory.length;
						input.value = "";
					}
				} else if (e.key === "Tab") {
					e.preventDefault();
					const partial = input.value;
					const matches = Object.keys(commands).filter((cmd) => cmd.startsWith(partial));
					if (matches.length === 1) {
						input.value = matches[0];
					}
				}
			});

			// Keep input focused
			document.addEventListener("click", () => input.focus());

			// Initial welcome
			window.addEventListener("load", () => {
				addOutput("", commands.neofetch());
			});
		</script>
	</body>
</html>
